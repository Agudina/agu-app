<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agu Control</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --card: var(--tg-theme-secondary-bg-color, #1a1d24);
    --text: var(--tg-theme-text-color, #e8eaed);
    --hint: var(--tg-theme-hint-color, #8a9099);
    --accent: var(--tg-theme-button-color, #3d8bfd);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --ok: #2fbf71; --warn: #e0a526; --bad: #e5484d; --idle: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 16px 6px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { color: var(--hint); font-size: 12px; }
  nav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 12px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  nav button { flex: 0 0 auto; border: 0; border-radius: 16px; padding: 7px 13px; background: var(--card); color: var(--text); font-size: 13px; }
  nav button.on { background: var(--accent); color: var(--accent-text); }
  main { padding: 4px 12px 28px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .card h2 { margin: 0 0 8px; font-size: 14px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(127,127,127,.12); }
  .row:last-child { border-bottom: 0; }
  .row .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .r.wrap { white-space: normal; }
  .muted { color: var(--hint); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .ok { background: var(--ok); } .down { background: var(--bad); } .idle { background: var(--idle); } .off { background: transparent; border: 1.5px solid var(--idle); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(127,127,127,.18); }
  .pill.g { background: rgba(47,191,113,.18); color: var(--ok); } .pill.y { background: rgba(224,165,38,.18); color: var(--warn); } .pill.r { background: rgba(229,72,77,.18); color: var(--bad); }
  .big { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { background: var(--card); border-radius: 14px; padding: 12px; }
  .kpi .muted { display: block; }
  .pos { color: var(--ok); } .neg { color: var(--bad); }
  .btn { border: 0; border-radius: 10px; padding: 8px 12px; background: var(--accent); color: var(--accent-text); font-size: 13px; }
  .btn.ghost { background: rgba(127,127,127,.18); color: var(--text); }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl input[type=range] { width: 120px; }
  select { padding: 7px; border-radius: 8px; border: 0; background: rgba(127,127,127,.15); color: var(--text); }
  .alert { border-left: 3px solid var(--bad); }
  .empty { color: var(--hint); text-align: center; padding: 30px 10px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(127,127,127,.2); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Agu Control <span style="font-size:11px;font-weight:500;color:var(--hint)">UI v6 · 1 Nov</span></h1>
  <div class="sub" id="stamp">loading…</div>
</header>
<nav id="tabs"></nav>
<main id="view"><div class="empty">Loading…</div></main>
<script>
const TG = window.Telegram && window.Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); }
const TABS = [["home","Home"],["acct","Accounts"],["shadow","Shadow"],["edges","Edges"],["calc","Calc"],["res","Research"],["wage","Wage"],["ctl","Controls"],["sys","System"],["cmds","Commands"]];
let S = null, tab = "home";
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return d.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const money = (v) => v == null ? "–" : (v < 0 ? "-$" : "$") + Math.abs(+v).toFixed(2);
const sgn = (v, d=1) => v == null ? "–" : (v > 0 ? "+" : "") + (+v).toFixed(d);

async function decode() {
  const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
  if (!m) throw new Error("no data in the link -- open the app from the bot's 📱 button (send /app)");
  let b64 = m[1].replace(/-/g, "+").replace(/_/g, "/"); while (b64.length % 4) b64 += "=";
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(ds).text());
}

function send(action, question) {
  const go = () => {
    if (TG && TG.sendData && TG.initData !== undefined) { TG.sendData(JSON.stringify(action)); }
    else alert("Open the app from the bot's 📱 button to send changes.");
  };
  if (TG && TG.showConfirm) TG.showConfirm(question, ok => { if (ok) go(); }); else if (confirm(question)) go();
}

function runCmd(c) {   // V4: a read-only bot command -- the answer arrives in the chat (the app closes)
  if (TG && TG.sendData && TG.initData !== undefined) TG.sendData(JSON.stringify({a: "cmd", c: c}));
  else alert("Open the app from the bot's 📱 button to run commands.");
}

function quick(action) {   // V6: read-only request (a log) -- no confirmation; the answer arrives in the chat
  if (TG && TG.sendData && TG.initData !== undefined) TG.sendData(JSON.stringify(action));
  else alert("Open the app from the bot's 📱 button.");
}

function stats(x) {   // V4: the raw model calculator, same maths as raw_model_calculator.py
  const n = x.length; if (n < 2) return {n};
  const m = x.reduce((a, b) => a + b, 0) / n, sd = Math.sqrt(x.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1)), se = sd / Math.sqrt(n);
  const w = x.filter(v => v > 0), l = x.filter(v => v <= 0), h = Math.floor(n / 2), avg = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : null;
  const ls = l.reduce((a, b) => a + b, 0);
  return {n, m, sd, se, t: se ? m / se : null, en: sd ? m / sd : null, need: (m > 0 && sd) ? Math.round((2 * sd / m) ** 2) : null,
          win: w.length / n, aw: avg(w), al: avg(l), pf: ls < 0 ? w.reduce((a, b) => a + b, 0) / -ls : null, h1: avg(x.slice(0, h)), h2: avg(x.slice(h))};
}
function calcRows(o, usd) {
  if (!o || !o.n || o.n < 2) return `<div class="muted">${o && o.n ? o.n + " trade -- too few to measure" : "no closed trades yet"}</div>`;
  const f = (v, d = 1) => v == null ? "–" : (+v).toFixed(d), tv = o.t;
  const verdict = tv == null ? "–" : tv >= 2.5 ? "strong (≥ 2.5)" : tv >= 2 ? "passes (≥ 2)" : tv >= 1 ? "promising, not proven" : tv >= 0 ? "could easily be luck" : "losing";
  const pill = tv >= 2 ? "g" : tv >= 1 ? "y" : tv < 0 ? "r" : "";
  return `<div class="row"><div class="l">Trades</div><div class="r">${o.n}${usd != null ? ` · ${money(usd)} net` : ""}</div></div>
    <div class="row"><div class="l">Average per trade</div><div class="r ${o.m > 0 ? "pos" : o.m < 0 ? "neg" : ""}">${sgn(o.m)} bp</div></div>
    <div class="row"><div class="l">Noise (SD)</div><div class="r">${f(o.sd)} bp</div></div>
    <div class="row"><div class="l">Uncertainty of the average (SE)</div><div class="r">±${f(o.se)} bp <div class="muted">${f(o.sd)} / √${o.n}</div></div></div>
    <div class="row"><div class="l"><b>t</b> <span class="pill ${pill}">${verdict}</span></div><div class="r"><b>${sgn(o.t, 2)}</b><div class="muted">${sgn(o.m)} / ${f(o.se)}</div></div></div>
    <div class="row"><div class="l">Edge per unit of noise</div><div class="r">${sgn(o.en, 3)}</div></div>
    <div class="row"><div class="l">Trades needed for t = 2</div><div class="r">${o.need == null ? "never (no edge)" : o.need}<div class="muted">(2 / ${f(o.en, 3)})²</div></div></div>
    ${o.need ? `<div class="bar"><i style="width:${Math.min(100, 100 * o.n / o.need)}%"></i></div>` : ""}
    <div class="row"><div class="l">Wins</div><div class="r">${Math.round(100 * o.win)}% · avg win ${sgn(o.aw)} · avg loss ${sgn(o.al)}</div></div>
    <div class="row"><div class="l">Profit factor</div><div class="r">${f(o.pf, 2)} <span class="muted">(> 1 makes money)</span></div></div>
    <div class="row"><div class="l">1st half / 2nd half</div><div class="r">${sgn(o.h1)} / ${sgn(o.h2)} bp <span class="pill ${o.h1 > 0 && o.h2 > 0 ? "g" : "y"}">${o.h1 > 0 && o.h2 > 0 ? "consistent" : "not stable yet"}</span></div></div>`;
}
function calcTyped() {
  const x = (document.getElementById("cx").value.match(/-?\d+(\.\d+)?/g) || []).map(Number);
  const o = stats(x);
  document.getElementById("cout").innerHTML = calcRows(o) + (o.n >= 2 ? `<div class="muted" style="margin-top:6px">The average trade made ${sgn(o.m)} bp; single trades swing about ${o.sd.toFixed(0)} bp, so the average is uncertain by ±${o.se.toFixed(1)} bp and sits ${(o.t ?? 0).toFixed(1)} steps from zero.</div>` : "");
}

function verdictPill(v) {
  const c = v === "OK" ? "g" : v === "WATCH" ? "y" : v === "PAUSE SUGGESTED" ? "r" : "";
  return `<span class="pill ${c}">${esc(v || "–")}</span>`;
}

const VIEWS = {
  home() {
    const bad = S.health.filter(h => h.s === "down");
    let h = "";
    if (bad.length) h += `<div class="card alert"><h2>⚠️ Needs you</h2>${bad.map(b => `<div class="row"><div class="l"><span class="dot down"></span>${esc(b.n)}</div><div class="r muted">${b.age} min</div></div><div class="muted" style="margin:-2px 0 6px 17px">${esc(b.why)}</div>`).join("")}</div>`;
    const tot = S.acct.filter(a => a.ok).reduce((s, a) => s + (+a.bal || 0), 0), risk = S.acct.reduce((s, a) => s + (+a.risk || 0), 0);
    h += `<div class="grid2"><div class="kpi"><span class="muted">All accounts</span><span class="big">${money(tot)}</span></div><div class="kpi"><span class="muted">At stops now</span><span class="big">${money(risk)}</span><span class="muted">${tot ? (100*risk/tot).toFixed(1) + "% of all money" : ""}</span></div></div>`;
    const sys = S.sys || {};
    h += `<div class="card"><h2>Systems</h2>${Object.entries(sys).map(([n, s]) => `<div class="row"><div class="l"><b>${esc(n)}</b> ${verdictPill(s.v)}</div><div class="r">${s.n || 0} trades · ${s.avg == null ? "–" : sgn(s.avg) + " bp"}<div class="muted">test ${s.test == null ? "–" : sgn(s.test) + " bp"} · open ${s.open ?? 0}</div></div></div>`).join("")}${goldRow()}<div class="muted">decay report ${esc(S.decay_t)} UTC</div></div>`;
    h += `<div class="card"><h2>Health</h2>${S.health.map(x => `<div class="row"><div class="l"><span class="dot ${x.s}"></span>${esc(x.n)}</div><div class="r muted">${x.s === "off" ? "not set up" : x.s === "idle" ? "weekend / off-hours" : x.age + " min"}</div></div>`).join("")}</div>`;
    return h;
  },
  acct() {
    return S.acct.map(a => `<div class="card"><h2>${esc(a.n)} · ${a.a}</h2>${a.ok ? `<div class="row"><div class="l">Balance</div><div class="r big">${money(a.bal)}</div></div><div class="row"><div class="l">Loss if every stop hits</div><div class="r">${money(a.risk)} ${a.bal ? `<span class="muted">(${(100*a.risk/a.bal).toFixed(1)}%)</span>` : ""}</div></div>${(a.pos || []).map(p => `<div class="row"><div class="l">${esc(p[0])} <span class="pill">${esc(p[1] || "")}</span> <span class="muted">${esc(p[2])}</span></div><div class="r">${p[3] == null ? "–" : "-" + money(p[3]) + " at stop"}</div></div>`).join("") || `<div class="muted">no open trades</div>`}` : `<div class="muted">no data yet</div>`}</div>`).join("");
  },
  shadow() {
    const rows = S.shadow || [];
    if (!rows.length) return `<div class="empty">No pairs in shadow.</div>`;
    const g = S.grads || {}, gl = Object.entries(g).flatMap(([k, v]) => v.map(s => k + " " + s));
    let h = `<div class="card"><h2>Back from shadow (graduates)</h2>${gl.length ? gl.map(esc).join(", ") : `<span class="muted">none yet</span>`}</div>`;
    h += rows.map(r => { const [sy, sym, since, why, closed, wins, streak, need, lock, openbp] = r;
      return `<div class="card"><div class="row"><div class="l"><b>${esc(sym)}</b> <span class="pill">${esc(sy)}</span>${lock ? ` <span class="pill r">locked</span>` : ""}</div><div class="r muted">since ${esc(since)}</div></div>
      <div class="muted">${esc(why)}</div>
      <div class="row"><div class="l">Shadow trades</div><div class="r">${closed ?? 0} closed · ${wins ?? 0} won${openbp != null ? ` · open ${sgn(openbp)} bp` : ""}</div></div>
      <div class="row"><div class="l">Back to live</div><div class="r">${lock ? "never (locked)" : `${streak}/${need} wins in a row`}</div></div>
      ${lock ? "" : `<div class="bar"><i style="width:${Math.min(100, 100*(streak||0)/(need||2))}%"></i></div>`}
      <div style="margin-top:8px"><button class="btn ghost" onclick='send({a:"live",sys:${JSON.stringify(sy)},sym:${JSON.stringify(sym)}}, "Put ${esc(sy)} ${esc(sym)} back on LIVE now?")'>Put back on live</button></div></div>`; }).join("");
    return h;
  },
  edges() {
    return goldCard() + Object.entries(S.sys || {}).map(([n, s]) => `<div class="card"><h2>${esc(n)}</h2>
      <div class="row"><div class="l">Verdict</div><div class="r">${verdictPill(s.v)}</div></div>
      <div class="row"><div class="l">Closed live trades</div><div class="r">${s.n || 0} <span class="muted">(${n === "DL1" ? "checkpoint 20" : "judged at 20 / 30"})</span></div></div>
      <div class="bar"><i style="width:${Math.min(100, 100*(s.n||0)/20)}%"></i></div>
      <div class="row"><div class="l">Live average</div><div class="r">${s.avg == null ? "–" : sgn(s.avg) + " bp"}${s.win != null ? ` · ${Math.round(100*s.win)}% wins` : ""}</div></div>
      <div class="row"><div class="l">Test average</div><div class="r">${s.test == null ? "–" : sgn(s.test) + " bp"}</div></div>
      <div class="row"><div class="l">Real cost (round trip)</div><div class="r">${s.fill == null ? "–" : sgn(s.fill) + " bp"} <span class="muted">vs ${s.budget == null ? "–" : (+s.budget).toFixed(1)} bp assumed</span></div></div>
      <div class="row"><div class="l">Net profit</div><div class="r ${s.net > 0 ? "pos" : s.net < 0 ? "neg" : ""}">${money(s.net)}</div></div></div>`).join("") || `<div class="empty">No decay report yet.</div>`;
  },
  calc() {
    const C = S.calc || {}, R = S.rev;
    let h = `<div class="card"><h2>Your own numbers</h2><div class="muted">Trade results in bp, e.g. 12 -30 8 15</div>
      <textarea id="cx" rows="2" style="width:100%;margin:6px 0;padding:8px;border-radius:8px;border:0;background:rgba(127,127,127,.15);color:var(--text)"></textarea>
      <button class="btn" onclick="calcTyped()">Calculate</button><div id="cout" style="margin-top:8px"></div></div>`;
    h += ["1D", "4h", "DL1"].map(k => `<div class="card"><h2>${k} live · gross bp</h2>${calcRows(C[k], (C[k] || {}).usd)}</div>`).join("");
    if (R) h += `<div class="card"><h2>EUR reverse record (no money)</h2>${Object.keys(R).filter(k => k !== "t").map(k => { const z = R[k] || {}, a = z.a || {}, r = z.r || {};
        const line = q => !q.n ? "no closed trades" : `${q.n} · ${sgn(q.mean_bp)} bp · t ${q.t == null ? "–" : sgn(q.t, 2)} · ${Math.round(100 * q.win)}% wins`;
        return `<div class="row"><div class="l"><b>${k}</b> as signalled</div><div class="r wrap">${line(a)}</div></div>
          <div class="row"><div class="l"><b>${k}</b> REVERSED</div><div class="r wrap ${r.mean_bp > 0 ? "pos" : r.mean_bp < 0 ? "neg" : ""}">${line(r)}</div></div>
          ${(z.rf || {}).n && (z.ri || {}).n ? `<div class="row"><div class="l muted">reversed FX only</div><div class="r wrap ${z.rf.mean_bp > 0 ? "pos" : "neg"}">${line(z.rf)}</div></div><div class="row"><div class="l muted">reversed indices only</div><div class="r wrap ${z.ri.mean_bp > 0 ? "pos" : "neg"}">${line(z.ri)}</div></div>` : ""}
          ${(z.last || []).map(t => `<div class="row"><div class="l muted">${esc(t[0])} ${esc(t[1])} ${esc(t[2])}</div><div class="r muted">${sgn(t[3])} bp (${esc(t[4])})</div></div>`).join("")}`; }).join("")}
      <div class="muted">EUR-pair signals (1D, DL1) also played the opposite way. 1D EUR backtest: as signalled -0.8 / +1.0 bp, reversed about -1.2 / -3.0 bp -- no edge either way yet. Updated ${esc(R.t)} UTC.</div></div>`;
    h += `<div class="muted" style="text-align:center">t ≥ 2 = proven · "trades needed" = how many trades this edge needs to prove itself</div>`;
    return h;
  },
  res() {
    const R = S.res || {}, V = {PASS: "g", LIVE: "g", FIXED: "g", FAIL: "r", RUNNING: "y", CANDIDATE: "y"};
    let h = "";
    const us = R.us || {};
    h += `<div class="card"><h2>DL1 · US family (training)</h2>${["US500", "NAS100", "US30"].map(g => { const u = us[g];
      if (!u) return `<div class="row"><div class="l"><b>${g}</b> + 7 USD pairs</div><div class="r muted">not run yet</div></div>`;
      const lab = ["> +0.5 bp", "t ≥ 2.5", "60% months", "150 trades", "beats LightGBM"];
      return `<div class="row"><div class="l"><b>${g}</b> <span class="pill">${esc(u.m || "")}</span> <span class="pill ${u.pass1 ? "g" : "r"}">${u.pass1 ? "stage 1 PASS" : "FAIL"}</span></div><div class="r">${sgn(u.bp)} bp · t ${sgn(u.t, 2)}<div class="muted">${u.n} trades · LightGBM ${sgn(u.lg)} bp</div></div></div>
        <div class="muted" style="margin:-2px 0 6px">${lab.map((l, i) => (u.ok[i] ? "✓ " : "✗ ") + l).join(" · ")}</div>`; }).join("")}
      <div class="muted">Pass rule fixed before training: AguEdge_1D_US\\PASS_RULE.txt. A pass is then replayed with DL1's real stop, and goes to shadow first.</div></div>`;
    const ev = R.ev;
    if (ev) h += `<div class="card"><h2>EV research</h2>
      <div class="row"><div class="l">World EV sales ${esc(ev.year || "")}</div><div class="r">${sgn(ev.growth, 0)}% · ${ev.share ?? "–"}% of new cars <span class="pill g">${esc(ev.back || "")}</span></div></div>
      ${(ev.th || []).map(t => `<div class="row"><div class="l" style="flex-direction:column;align-items:flex-start;gap:0"><b>${esc(t[0])}</b><span class="muted">${esc(t[5] || "")} · ${esc(t[8])}</span></div><div class="r wrap">${t[7] ? `<span class="pill g">${esc(t[1])}</span>` : `<span class="pill">no proven edge</span>`}<div class="muted">lean ${sgn(t[2], 2)} · 3-month range ${sgn(t[3], 0)}% to ${sgn(t[4], 0)}%</div></div></div>`).join("")}
      <div class="row"><div class="l">Model skill test</div><div class="r"><span class="pill ${ev.gate ? "g" : "r"}">${ev.gate ? "passed" : "not passed yet"}</span></div></div>
      <div class="muted">LightGBM direction + PGBM range, 3-month horizon, scored only on unseen data. Built ${esc(ev.t)}. Research only -- not a trade signal.</div>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn" onclick='send({a:"ev_run"}, "Refresh the EV research now? (downloads the latest data and re-runs the models, a few minutes)")'>Update EV data</button><button class="btn ghost" onclick='runCmd("ev")'>Full brief</button></div></div>`;
    h += `<div class="card"><h2>Every edge test</h2>${(R.log || []).map(r => `<div class="row"><div class="l" style="flex-direction:column;align-items:flex-start;gap:0"><b>${esc(r[1])}</b><span class="muted">${esc(r[0])} · ${esc(r[3])}</span></div><div class="r"><span class="pill ${V[r[2]] || ""}">${esc(r[2])}</span></div></div>`).join("") || `<div class="muted">no research log yet</div>`}
      <div class="muted">Newest first. AGU_MONITOR\\research\\research_log.json · /research in the chat.</div></div>`;
    return h;
  },
  sys() {
    const Y = S.sys2 || {}, sup = Y.sup || {}, F = Y.files || {};
    const supRow = (k, label) => { const v = sup[k]; const ok = v && v[0] != null && v[0] <= 35;
      return `<div class="row"><div class="l" style="flex-direction:column;align-items:flex-start;gap:0"><span><span class="dot ${ok ? "ok" : "down"}" style="display:inline-block"></span> <b>${label}</b></span><span class="muted">${v ? esc(v[1]) + " · " + v[0] + " min ago" : "never started"}</span></div><div class="r">${ok ? "" : `<button class="btn" onclick='send({a:"sup_start",kind:${JSON.stringify(k)}}, "Start the ${label} supervisor?")'>Start</button>`}</div></div>`; };
    const pill = st => st === "up" ? "g" : (st === "PAUSED" || st === "stopped(weekend)") ? "r" : st === "starting" ? "y" : "";
    let h = `<div class="card"><h2>Supervisors</h2>${supRow("monitors", "Always-on monitors")}${supRow("supervisor", "cTrader runners")}
      <div class="muted">They start every program below and restart it if it stops. The runners wait for cTrader to be logged in.</div></div>`;
    h += `<div class="card"><h2>Programs</h2>${(Y.jobs || []).map(j => `<div class="row"><div class="l" style="flex-direction:column;align-items:flex-start;gap:0"><span><b>${esc(j[0])}</b> <span class="pill ${pill(j[1])}">${esc(j[1] === "?" ? "not started yet" : j[1])}</span></span><span class="muted">${j[4] ? (j[2] == null ? "no log" : "log written " + (j[2] < 120 ? j[2] + " min" : j[2] < 2880 ? Math.round(j[2] / 60) + " h" : Math.round(j[2] / 1440) + " days") + " ago") : "cBot launcher (restart in cTrader)"}</span></div><div class="r" style="display:flex;gap:6px">${j[4] ? `<button class="btn ghost" onclick='quick({a:"job_log",name:${JSON.stringify(j[0])}})'>Log</button><button class="btn ghost" onclick='send({a:"job_restart",name:${JSON.stringify(j[0])}}, "Restart ${esc(j[0])}? (it stops now; its supervisor starts it again within about a minute)")'>Restart</button>` : ""}</div></div>`).join("") || `<div class="muted">watchers.json not found</div>`}</div>`;
    h += `<div class="card"><h2>File check</h2><div class="row"><div class="l">Scripts delivered by Claude</div><div class="r"><span class="pill ${F.bad && F.bad.length ? "r" : "g"}">${F.n ? (F.n - (F.bad || []).length) + " / " + F.n + " match" : "no list yet"}</span></div></div>
      ${(F.bad || []).map(b => `<div class="row"><div class="l muted">${esc(b)}</div><div class="r"><span class="pill r">different</span></div></div>`).join("")}
      <div class="muted">Each file's fingerprint (SHA-256) against AGU_MONITOR\\file_manifest.json, updated ${esc(F.t || "–")}. Replaces the PowerShell check blocks.</div></div>`;
    return h;
  },
  cmds() {
    const L = [["check", "Gold market card", "status, levels to watch, 24 h range"], ["gold", "Gold buy plan", "ATR stop and size, like the cBot (defaults)"],
      ["record", "Gold forward record", "how YES and GET READY days turned out"], ["forward", "No-money forward records", "WTI and USDJPY trend-buy, the dip rule"],
      ["dip", "Dip rule record", "open trades, last signals, results by group"], ["plat", "Platinum card", "status, levels, stop, size"],
      ["decay", "Edge decay report", "1D, 4h, DL1 live vs test, signal rate, regime"], ["shadow", "Shadow report", "why, since when, wins needed"],
      ["risk", "All accounts", "money, open trades, loss at the stops"], ["wage", "Wage account", "balance, this week, safe to withdraw"],
      ["calc", "Raw model calculator", "every system's t, edge/noise, trades needed (also the Calc tab)"],
      ["reverse", "EUR reverse record", "1D and DL1 EUR signals traded the opposite way (also the Calc tab)"],
      ["research", "Research log", "every edge test and its verdict (also the Research tab)"], ["ev", "EV research brief", "lithium / cobalt / manganese outlooks, model skill (also the Research tab)"], ["help", "All commands", "the full list with options"]];
    return `<div class="card"><h2>Bot commands</h2>${L.map(([c, t, d]) => `<div class="row"><div class="l" style="flex-direction:column;align-items:flex-start;gap:0"><b>${esc(t)}</b><span class="muted">/${c} · ${esc(d)}</span></div><div class="r"><button class="btn ghost" onclick='runCmd(${JSON.stringify(c)})'>Show</button></div></div>`).join("")}</div>
      <div class="muted" style="text-align:center">The answer arrives in the chat (the app closes). Commands with options, like /gold 400 2 3d, still work typed.</div>`;
  },
  wage() {
    const w = S.wage;
    if (!w) return `<div class="empty">The wage copier has not reported yet (build AguWageCopy, fund 9065212).</div>`;
    return `<div class="grid2"><div class="kpi"><span class="muted">Balance</span><span class="big">${money(w.bal)}</span></div><div class="kpi"><span class="muted">This week</span><span class="big ${w.week_net > 0 ? "pos" : w.week_net < 0 ? "neg" : ""}">${money(w.week_net)}</span><span class="muted">${w.week_n} closed</span></div></div>
      <div class="card"><div class="row"><div class="l">Open copies</div><div class="r">${w.open} · floating ${money(w.float)}</div></div>
      <div class="row"><div class="l"><b>Safe to withdraw</b></div><div class="r big">${money(w.take)}</div></div>
      <div class="muted">This week's closed profit, less any open loss. Best after the Friday 11:00 New York close.</div></div>`;
  },
  ctl() {
    const c = S.ctl || {}, w = c.wage || {};
    const slider = (id, val, min, max, step, label, act) => `<div class="row"><div class="l">${label}</div><div class="ctl"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val ?? min}" oninput="document.getElementById('${id}v').textContent=this.value"><b id="${id}v">${val ?? "–"}</b><button class="btn" onclick='${act}'>Set</button></div></div>`;
    let h = `<div class="card"><h2>Gold</h2>${slider("gr", c.gold_risk, 1, 25, 1, "Risk per trade %", `send({a:"gold_risk",v:+document.getElementById("gr").value}, "Set gold risk to "+document.getElementById("gr").value+"% per trade?")`)}
      <div class="row"><div class="l">New gold trades</div><div class="r"><button class="btn ${c.gold_on ? "ghost" : ""}" onclick='send({a:"gold_on",v:${!c.gold_on}}, "${c.gold_on ? "STOP opening new gold trades?" : "ALLOW new gold trades?"}")'>${c.gold_on ? "Turn off" : "Turn on"}</button></div></div></div>`;
    h += `<div class="card"><h2>Wage account copies</h2>${Object.entries(w).map(([n, s]) => `<div class="row"><div class="l">${esc(n)} <span class="muted">${s.risk ? s.risk + "% risk" : "same risk as source"}</span></div><div class="r"><button class="btn ${s.on ? "ghost" : ""}" onclick='send({a:"wage_on",src:${JSON.stringify(n)},v:${!s.on}}, "${s.on ? "Stop" : "Start"} copying ${esc(n)} to the wage account?")'>${s.on ? "Turn off" : "Turn on"}</button></div></div>`).join("")}
      ${w["4h"] ? slider("wr", w["4h"].risk, 1, 15, 1, "4h copy risk %", `send({a:"wage_risk",src:"4h",v:+document.getElementById("wr").value}, "Set 4h copies to "+document.getElementById("wr").value+"% risk?")`) : ""}</div>`;
    h += `<div class="card"><h2>DL1</h2>${slider("dm", c.dl1_max, 1, 3, 1, "Max open trades", `send({a:"dl1_max",v:+document.getElementById("dm").value}, "Allow at most "+document.getElementById("dm").value+" open DL1 trade(s)?")`)}</div>`;
    h += `<div class="card"><h2>4h</h2>${(c.h4_live || []).map(s => `<div class="row"><div class="l">${esc(s)} <span class="pill g">live</span></div><div class="r"><button class="btn ghost" onclick='send({a:"shadow",sys:"4h",sym:${JSON.stringify(s)}}, "Move 4h ${esc(s)} to SHADOW? (keeps recording, no money)")'>Shadow</button></div></div>`).join("") || `<div class="muted">no 4h pair live -- see the Shadow tab</div>`}
      <div class="row"><div class="l">Take-profit <span class="pill ${c.h4_tp ? "y" : "g"}">${c.h4_tp ? "on" : "off -- stop only"}</span></div><div class="r"><button class="btn ghost" onclick='send({a:"h4_tp",v:${!c.h4_tp}}, "${c.h4_tp ? "Turn the 4h take-profit OFF? (the stop stays; winners run to the 8 h exit)" : "Turn the 4h take-profit back ON?"}")'>${c.h4_tp ? "Turn off" : "Turn on"}</button></div></div>
      ${(c.h4_paused || []).filter(s => ["UK100","JPN225"].includes(s)).map(s => `<div class="row"><div class="l">${esc(s)} <span class="pill y">paused</span></div><div class="r"><button class="btn" onclick='send({a:"h4_resume",sym:${JSON.stringify(s)}}, "RESUME 4h ${esc(s)}?")'>Resume</button></div></div>`).join("")}</div>`;
    h += `<div class="card"><h2>Move a pair to shadow</h2><div class="ctl"><select id="ss"><option>DL1</option><option>1D</option><option>4h</option></select><input id="sy" placeholder="e.g. AUDJPY" style="flex:1;min-width:0;padding:7px;border-radius:8px;border:0;background:rgba(127,127,127,.15);color:var(--text)"><button class="btn" onclick='const s=document.getElementById("ss").value,y=document.getElementById("sy").value.trim().toUpperCase(); if(/^[A-Z0-9]{5,7}$/.test(y)) send({a:"shadow",sys:s,sym:y}, "Move "+s+" "+y+" to SHADOW (no trading)?")'>Shadow</button></div></div>`;
    h += `<div class="muted" style="text-align:center">Every change asks you first, is checked again by the bot on your PC, and is logged.</div>`;
    return h;
  },
};

function goldPill(st) {
  const c = st === "YES" ? "g" : st === "GET READY" ? "y" : "";
  return `<span class="pill ${c}">${esc(st || "–")}</span>`;
}
function goldRow() {
  const g = S.gold; if (!g) return "";
  return `<div class="row"><div class="l"><b>Gold</b> ${goldPill(g.status)}</div><div class="r">${g.n} trades · ${money(g.net)}<div class="muted">test +${g.test.r} R/trade · ${g.on ? "on" : "off"} · ${g.risk}% risk</div></div></div>`;
}
function goldCard() {
  const g = S.gold; if (!g) return "";
  const t = g.test || {};
  return `<div class="card"><h2>Gold</h2>
    <div class="row"><div class="l">Buy setup</div><div class="r">${goldPill(g.status)} <span class="muted">${esc(g.decision || "")}</span></div></div>
    <div class="row"><div class="l">Last gold-day close</div><div class="r">${g.close ?? "–"} <span class="muted">${esc(g.decided)} UTC</span></div></div>
    <div class="row"><div class="l">vs 50-day average</div><div class="r ${g.gap50 > 0 ? "pos" : g.gap50 < 0 ? "neg" : ""}">${g.gap50 == null ? "–" : sgn(g.gap50, 2) + "%"} <span class="muted">(${g.ma50 ?? "–"})</span></div></div>
    <div class="row"><div class="l">4h trend</div><div class="r">${esc(g.trend || "–")}</div></div>
    <div class="muted" style="margin:2px 0 6px">Buys only when the close is above the 50-day AND the 4h trend is UP.</div>
    <div class="row"><div class="l">Live trades</div><div class="r">${g.n} · ${g.wins} won · ${money(g.net)}</div></div>
    <div class="row"><div class="l">Test</div><div class="r wrap">+${t.r} R/trade · ${Math.round(100*(t.win||0))}% wins<div class="muted">${t.n} trades ${esc(t.span)}, ${esc(t.note)}</div></div></div>
    <div class="row"><div class="l">Account</div><div class="r">${money(g.bal)} · ${g.risk}% risk · trading ${g.on ? "on" : "off"}</div></div>
    ${(g.open || []).map(o => `<div class="row"><div class="l">OPEN ${o[0]} oz @ ${o[1]}</div><div class="r">stop ${o[2] ?? "–"} · ${money(o[3])}</div></div>`).join("")}</div>`;
}

function render() {
  const nav = document.getElementById("tabs"); nav.innerHTML = "";
  TABS.forEach(([k, label]) => { const b = $(`<button class="${k === tab ? "on" : ""}">${label}</button>`); b.onclick = () => { tab = k; render(); scrollTo(0, 0); }; nav.appendChild(b); });
  document.getElementById("view").innerHTML = VIEWS[tab]();
}

decode().then(d => {
  S = d;
  document.getElementById("stamp").textContent = `as of ${d.t} UTC · market ${d.mkt ? "open" : "closed"} · send /app for fresh data`;
  render();
}).catch(e => { document.getElementById("view").innerHTML = `<div class="empty">${esc(e.message)}</div>`; document.getElementById("stamp").textContent = ""; });
</script>
</body>
</html>
